[project]
name = "shezhire"
version = "0.1.0"
description = "Family tree from recorded stories, built by a local open-weight model and checked line by line against the recording."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27", "rapidfuzz>=3"]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0"]
dev = ["pytest"]
